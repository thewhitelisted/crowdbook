# A thousand zero-intelligence traders with two market makers, twenty trend followers and traders
# who follow the asset's true value: ten experts who see it within a second or so, and 400
# followers who see it about half a minute late, each with a lasting view of its own. The stylized
# facts in docs/results.md come from this market and from large_noise.toml, the same noise traders
# on their own.
#
# The traders who follow the value keep the price near it, and to do that they must absorb the noise
# traders' net order flow, which wanders like a random walk: tens of thousands of lots over a day.
# The experts hold up to 5,000 lots each and the followers 1,000, so it takes a crowd: with five
# experts and 120 followers on 500, the memory market's filled up within half a day and its price
# then drifted tens of ticks from the value. The followers act only when the price is at least 4
# ticks from what each thinks it worth: a crowd that trades smaller differences is a deep book of
# its own, and in the memory market it stopped volatility from clustering. The first market maker
# quotes about a tick either side of its fair price and the trend followers act on a one-tick trend;
# with wider settings, both sat idle once the informed traders held the price to the value.
#
#   crowdbook run examples/scenarios/large_market.toml --log large_market.csv \
#       --log-only trade,top_of_book

seed = 21
duration = "600s"
reference_price = 10000

# A random walk of 0.2 ticks per square root of a second, about 60 ticks over a day: calmer than
# the noise traders move the price on their own.
[fundamental]
volatility = 0.2
step = "100ms"

[[agents]]
type = "market_maker"
name = "maker"
risk_aversion = 0.005
volatility = 3.0
intensity = 1.0
quote_size = 10
max_inventory = 200
requote_interval = "50ms"
latency = { to_exchange = "20us", from_exchange = "20us" }
account = { max_position = 220, max_order_quantity = 10 }

[[agents]]
type = "market_maker"
name = "slow maker"
risk_aversion = 0.005
volatility = 3.0
intensity = 0.5
quote_size = 20
max_inventory = 200
requote_interval = "1s"
latency = { to_exchange = "200us", from_exchange = "200us" }
account = { max_position = 220, max_order_quantity = 20 }

[[agents]]
type = "zero_intelligence"
name = "noise"
count = 1000
limit_rate = 0.4
market_rate = 0.1
cancel_rate = 0.2
max_offset = 10
latency = { to_exchange = "300us", from_exchange = "300us", jitter = "100us" }
account = { max_position = 1000, max_order_quantity = 10 }

[[agents]]
type = "momentum"
name = "trend"
count = 20
interval = "100ms"
fast_half_life = "500ms"
slow_half_life = "5s"
threshold = 1.0
order_size = 5
max_position = 50
latency = { to_exchange = "500us", from_exchange = "500us", jitter = "200us" }
account = { max_position = 60, max_order_quantity = 5 }

[[agents]]
type = "informed"
name = "experts"          # fast and close to right
count = 10
interval = "200ms"
noise = 1.0
error = 0.5               # ticks of lasting error in what each believes
error_memory = "300s"
lag = "1s"                # how late, on average, each sees the value
threshold = 2.0           # ticks: half the width of each one's range of fair values
order_size = 5
max_position = 5000
latency = { to_exchange = "100us", from_exchange = "100us", jitter = "20us" }
account = { max_position = 5005, max_order_quantity = 5 }

[[agents]]
type = "informed"
name = "followers"        # slower, with views of their own
count = 400
interval = "5s"
noise = 1.0
error = 1.5               # ticks of lasting error in what each believes
error_memory = "300s"
lag = "30s"               # how late, on average, each sees the value
threshold = 4.0           # ticks: half the width of each one's range of fair values
order_size = 5
max_position = 1000
latency = { to_exchange = "100us", from_exchange = "100us", jitter = "20us" }
account = { max_position = 1005, max_order_quantity = 5 }
