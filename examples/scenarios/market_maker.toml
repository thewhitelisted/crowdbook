# An Avellaneda-Stoikov market maker with a fast connection, quoting against twenty
# zero-intelligence traders. Against uninformed flow like this it should earn the spread.
#
#   crowdbook run examples/scenarios/market_maker.toml --log market_maker.csv

seed = 7
duration = "60s"
reference_price = 10000

[[agents]]
type = "market_maker"
name = "maker"
risk_aversion = 0.005      # gamma: how hard inventory skews the quotes
volatility = 3.0           # sigma: ticks per square root of a second
intensity = 0.3            # k: sets the base half spread, about 1/k = 3 ticks
horizon = "1s"
quote_size = 10
max_inventory = 200
requote_interval = "50ms"
latency = { to_exchange = "20us", from_exchange = "20us" }
account = { max_position = 220, max_order_quantity = 10 }

[[agents]]
type = "zero_intelligence"
name = "noise"
count = 20
limit_rate = 1.0
market_rate = 1.0
cancel_rate = 1.0
max_offset = 8
latency = { to_exchange = "300us", from_exchange = "300us", jitter = "100us" }
account = { max_position = 1000, max_order_quantity = 10 }
