# The market maker of market_maker.toml on an exchange with maker-taker pricing: it is paid a
# rebate for every lot its resting quotes trade, and the noise traders, who take liquidity more
# often than they provide it, pay a fee. The exchange keeps the difference.
#
#   crowdbook run examples/scenarios/maker_taker.toml

seed = 7
duration = "60s"
reference_price = 10000

[exchange]
maker_fee = -0.2          # ticks per lot: a rebate for the resting order's owner
taker_fee = 0.3           # ticks per lot, paid by the incoming order's owner

[[agents]]
type = "market_maker"
name = "maker"
risk_aversion = 0.005
volatility = 3.0
intensity = 0.3
horizon = "1s"
quote_size = 10
max_inventory = 200
requote_interval = "50ms"
latency = { to_exchange = "20us", from_exchange = "20us" }
account = { max_position = 220, max_order_quantity = 10 }

[[agents]]
type = "zero_intelligence"
name = "noise"
count = 20
limit_rate = 1.0
market_rate = 1.0
cancel_rate = 0.2
max_offset = 8
latency = { to_exchange = "300us", from_exchange = "300us", jitter = "100us" }
account = { max_position = 1000, max_order_quantity = 10 }
