# A trading day: an opening auction, ten minutes of continuous trading that is busiest at the open
# and the close, a closing auction, and halts when the price runs more than 15 ticks from the last
# auction's price. Noise traders build the auctions' books with limit orders; the market makers, the
# trend followers and the traders who follow the true value, a few experts and a slower crowd, wait
# for continuous trading; brokers work large orders by the day's expected volume curve (VWAP) and
# pause in auctions.
#
#   crowdbook run examples/scenarios/trading_day.toml --log day.csv --log-only phase,trade
#   crowdbook play examples/scenarios/trading_day.toml

seed = 31
duration = "720s"
reference_price = 10000

[trading_day]
opening_auction = "60s"   # orders gather until a minute in, then the market opens at one price
closing_auction = "60s"   # and the last minute is the closing auction
halt_band = 15            # ticks from the last auction's price
halt = "30s"
activity = 2.0            # 1.8 times the day's average pace at the open and the close, 0.6 at midday

[fundamental]
volatility = 0.5
step = "250ms"

[exchange]
depth_levels = 10
maker_fee = -0.1
taker_fee = 0.2
auction_fee = 0.05

[participant]
latency = { to_exchange = "1ms", from_exchange = "1ms" }
account = { max_position = 100, max_order_quantity = 20 }

[[agents]]
type = "zero_intelligence"
name = "noise"
count = 60
limit_rate = 0.5
market_rate = 0.05
cancel_rate = 0.1
max_offset = 8
latency = { to_exchange = "300us", from_exchange = "300us", jitter = "100us" }
account = { max_position = 200, max_order_quantity = 10 }

[[agents]]
type = "market_maker"
name = "maker"
intensity = 1.0
quote_size = 5
max_inventory = 100
requote_interval = "250ms"
post_only = true
latency = { to_exchange = "20us", from_exchange = "20us" }
account = { max_position = 110, max_order_quantity = 10 }

[[agents]]
type = "market_maker"
name = "slow maker"
intensity = 0.5
quote_size = 10
max_inventory = 100
requote_interval = "1s"
post_only = true
latency = { to_exchange = "200us", from_exchange = "200us" }
account = { max_position = 110, max_order_quantity = 10 }

[[agents]]
type = "momentum"
name = "trend"
count = 5
interval = "500ms"
fast_half_life = "2s"
slow_half_life = "20s"
threshold = 1.0
order_size = 3
max_position = 30
latency = { to_exchange = "500us", from_exchange = "500us", jitter = "200us" }
account = { max_position = 33, max_order_quantity = 3 }

[[agents]]
type = "informed"
name = "experts"          # fast and close to right
count = 2
interval = "2s"
noise = 1.0
error = 1.0               # ticks of lasting error in what each believes
error_memory = "300s"
lag = "1s"                # how late, on average, each sees the value
threshold = 2.0           # ticks: half the width of each one's range of fair values
order_size = 3
max_position = 300
latency = { to_exchange = "200us", from_exchange = "200us", jitter = "50us" }
account = { max_position = 303, max_order_quantity = 3 }

[[agents]]
type = "informed"
name = "followers"        # slower, with views of their own
count = 30
interval = "5s"
noise = 1.0
error = 3.0               # ticks of lasting error in what each believes
error_memory = "300s"
lag = "30s"               # how late, on average, each sees the value
threshold = 4.0           # ticks: half the width of each one's range of fair values
order_size = 3
max_position = 200
latency = { to_exchange = "200us", from_exchange = "200us", jitter = "50us" }
account = { max_position = 203, max_order_quantity = 3 }

[[agents]]
type = "execution"
name = "brokers"
count = 5
style = "vwap"
min_parent = 20
max_parent = 200
pause = "60s"
interval = "1s"
child_size = 2
latency = { to_exchange = "200us", from_exchange = "200us", jitter = "50us" }
account = { max_position = 1000, max_order_quantity = 5 }
