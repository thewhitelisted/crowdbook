# The market maker scenario plus three trend followers who buy rising prices and sell falling
# ones with market orders. Compare the groups' PnL with market_maker.toml to see who pays for
# their trading. PnL values open positions at the last trade price.
#
#   crowdbook run examples/scenarios/trend_followers.toml --log trend_followers.csv

seed = 7
duration = "60s"
reference_price = 10000

[[agents]]
type = "market_maker"
name = "maker"
risk_aversion = 0.005
volatility = 3.0
intensity = 0.3
quote_size = 10
max_inventory = 200
requote_interval = "50ms"
latency = { to_exchange = "20us", from_exchange = "20us" }
account = { max_position = 220, max_order_quantity = 10 }

[[agents]]
type = "zero_intelligence"
name = "noise"
count = 20
limit_rate = 1.0
market_rate = 1.0
cancel_rate = 0.2         # each resting order lives 5 s on average unless it fills
max_offset = 8
latency = { to_exchange = "300us", from_exchange = "300us", jitter = "100us" }
account = { max_position = 1000, max_order_quantity = 10 }

[[agents]]
type = "momentum"
name = "trend"
count = 3
interval = "100ms"
fast_half_life = "500ms"   # the fast and slow moving averages of the price
slow_half_life = "5s"
threshold = 2.0            # ticks the fast average must lead by before trading
order_size = 5
max_position = 50
latency = { to_exchange = "500us", from_exchange = "500us", jitter = "200us" }
account = { max_position = 60, max_order_quantity = 5 }
