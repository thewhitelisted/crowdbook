# A binary contract on a game between a home and an away side: will the home side win? The market
# opens half an hour before kickoff, while the sides' strength drifts as news arrives; then two
# halves of 45 minutes with a 15-minute break, in which each side scores at random, two or three
# times a game between them, and the probability jumps on every score. A draw pays nothing, so the
# contract settles at 100 on a home win and at 0 otherwise, when the game ends.
#
# Makers quote around the probability as they see it, a second late, as makers do who price off a
# reference elsewhere. Sharp traders see it a second or two late and take mispricings of a couple
# of cents. Recreational bettors see it twenty seconds late with large errors of their own, rate
# long shots too high (a tilt in log-odds) and lean toward the home side.
#
#   crowdbook run examples/scenarios/game.toml --prices prices.csv --sample-interval 10s
#
# For a high-scoring game, set scores near 200 with points = [1, 2, 3], four periods and a tie that
# pays 50, or whatever the contract says.

seed = 1
duration = "135m"

[prediction]
probability = 0.45       # the home side's chance at kickoff
step = "1s"

[prediction.game]
start = "30m"            # kickoff, after the market opens
length = "90m"           # playing time
periods = 2
break = "15m"
scores = 2.7             # scores expected in the game, both sides together
points = [1]
tie = 0                  # cents a share pays on a draw
pregame_drift = 0.15     # the strength's spread of change before kickoff, in log-odds of scoring
in_play_drift = 0.1
news = 2                 # pieces of news expected before kickoff
news_size = 0.15

[exchange]
depth_levels = 10
order_delay = "5s"         # while the game is in play, orders wait before they reach the book;
order_delay_from = "30m"   # cancels do not
order_delay_until = "135m"

[participant]
latency = { to_exchange = "50ms", from_exchange = "50ms" }
account = { max_position = 500, max_order_quantity = 100 }

[[agents]]
type = "market_maker"
name = "makers"
count = 3
quote_value = true
noise = 0.5
error = 0.7
error_memory = "120s"
lag = "1s"
risk_aversion = 0.001
volatility = 1.0
intensity = 0.8
quote_size = 50
max_inventory = 2000
requote_interval = "500ms"
post_only = true
latency = { to_exchange = "20ms", from_exchange = "20ms" }
account = { max_position = 2100, max_order_quantity = 50 }

[[agents]]
type = "informed"
name = "sharps"
count = 4
interval = "1s"
noise = 0.3
error = 0.5
lag = "1500ms"
threshold = 2.0
order_size = 20
size_tail = 1.5
max_position = 1000
latency = { to_exchange = "30ms", from_exchange = "30ms", jitter = "10ms" }
account = { max_position = 1000, max_order_quantity = 1000 }

[[agents]]
type = "informed"
name = "bettors"
count = 60
interval = "60s"
noise = 3.0
error = 4.0
error_memory = "600s"
lag = "20s"
bias = 2.0               # cents toward the home side
tilt = 0.3               # long shots rated too high
threshold = 0.5
order_size = 5
size_tail = 1.2
max_position = 400
latency = { to_exchange = "200ms", from_exchange = "200ms", jitter = "100ms" }
account = { max_position = 400, max_order_quantity = 400 }

[[agents]]
type = "zero_intelligence"
name = "noise"
count = 10
limit_rate = 0.01
market_rate = 0.005
cancel_rate = 0.01
max_offset = 4
min_size = 1
max_size = 200
size_tail = 1.3
account = { max_position = 100000, max_order_quantity = 200 }
