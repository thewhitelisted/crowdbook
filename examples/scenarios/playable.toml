# A market slow enough to trade by hand: a few trades a second around a true value that wanders,
# with a market maker, trend followers and a handful of informed traders among the noise.
#
#   crowdbook play examples/scenarios/playable.toml --record session.toml
#   crowdbook replay session.toml

seed = 1
duration = "600s"
reference_price = 10000

[fundamental]
volatility = 0.5          # ticks per square root of a second: about 12 ticks over ten minutes
step = "250ms"

[exchange]
depth_levels = 10         # the ladder shows ten levels a side
maker_fee = -0.1          # ticks per lot: a small rebate for resting orders
taker_fee = 0.2

# You: a millisecond from the exchange, and limited to 100 lots either way.
[participant]
latency = { to_exchange = "1ms", from_exchange = "1ms" }
account = { max_position = 100, max_order_quantity = 20 }

[[agents]]
type = "zero_intelligence"
name = "noise"
count = 60
limit_rate = 0.5
market_rate = 0.05
cancel_rate = 0.1         # resting orders last ten seconds on average
max_offset = 8
latency = { to_exchange = "300us", from_exchange = "300us", jitter = "100us" }
account = { max_position = 200, max_order_quantity = 10 }

[[agents]]
type = "market_maker"
name = "maker"
intensity = 1.0
quote_size = 5
max_inventory = 100
requote_interval = "250ms"
post_only = true
latency = { to_exchange = "20us", from_exchange = "20us" }
account = { max_position = 110, max_order_quantity = 10 }

[[agents]]
type = "momentum"
name = "trend"
count = 5
interval = "500ms"
fast_half_life = "2s"
slow_half_life = "20s"
threshold = 1.0
order_size = 3
max_position = 30
latency = { to_exchange = "500us", from_exchange = "500us", jitter = "200us" }
account = { max_position = 33, max_order_quantity = 3 }

[[agents]]
type = "informed"
name = "informed"
count = 5
interval = "2s"
noise = 1.0
threshold = 2.0
order_size = 3
max_position = 300
latency = { to_exchange = "200us", from_exchange = "200us", jitter = "50us" }
account = { max_position = 303, max_order_quantity = 3 }
