# A prediction market on one yes-or-no question, such as an election, that resolves in thirty
# minutes. A share pays 100 cents if the answer is yes and nothing if it is no, so its price is the
# crowd's probability of yes, in cents. Nobody knows the probability exactly: six experts see it
# within a few seconds, thirty followers a minute late, each with a lasting view of its own, and
# eight partisans want the answer to be yes and see it eight cents likelier than it is. Noise
# traders, two market makers and trend followers trade too.
#
#   crowdbook run examples/scenarios/prediction.toml
#   crowdbook play examples/scenarios/prediction.toml

seed = 1
duration = "1800s"

[prediction]
probability = 0.5         # a coin flip at the start
news_rate = 0.01          # news about every hundred seconds
news_share = 0.5          # half of what decides the question arrives as news
step = "1s"

[exchange]
depth_levels = 10

[participant]
latency = { to_exchange = "1ms", from_exchange = "1ms" }
account = { max_position = 200, max_order_quantity = 20 }

[[agents]]
type = "zero_intelligence"
name = "noise"
count = 40
limit_rate = 0.5
market_rate = 0.05
cancel_rate = 0.1         # resting orders last ten seconds on average
max_offset = 3            # cents
latency = { to_exchange = "300us", from_exchange = "300us", jitter = "100us" }
account = { max_position = 200, max_order_quantity = 10 }

[[agents]]
type = "market_maker"
name = "maker"
volatility = 1.0          # cents per square root of a second, early in the run
intensity = 1.0
quote_size = 5
max_inventory = 100
requote_interval = "250ms"
post_only = true
latency = { to_exchange = "20us", from_exchange = "20us" }
account = { max_position = 110, max_order_quantity = 10 }

[[agents]]
type = "market_maker"
name = "slow maker"
volatility = 3.0          # quotes three times as wide, which stand a second
intensity = 0.5
quote_size = 10
max_inventory = 100
requote_interval = "1s"
post_only = true
latency = { to_exchange = "200us", from_exchange = "200us" }
account = { max_position = 110, max_order_quantity = 10 }

[[agents]]
type = "informed"
name = "experts"          # fast and close to right
count = 6
interval = "1s"
noise = 3.0
error = 2.0               # cents of lasting error in what each believes
error_memory = "300s"
lag = "2s"                # how late, on average, each sees the value
threshold = 2.0           # cents: half the width of each one's range of fair values
order_size = 5
max_position = 600
latency = { to_exchange = "200us", from_exchange = "200us", jitter = "50us" }
account = { max_position = 605, max_order_quantity = 5 }

[[agents]]
type = "informed"
name = "followers"        # slower, with views of their own
count = 30
interval = "5s"
noise = 3.0
error = 6.0               # cents of lasting error in what each believes
error_memory = "300s"
lag = "60s"               # how late, on average, each sees the value
threshold = 4.0           # cents: half the width of each one's range of fair values
order_size = 5
max_position = 300
latency = { to_exchange = "200us", from_exchange = "200us", jitter = "50us" }
account = { max_position = 305, max_order_quantity = 5 }

[[agents]]
type = "informed"
name = "partisans"        # tilted toward one side
count = 8
interval = "5s"
noise = 3.0
error = 6.0               # cents of lasting error in what each believes
error_memory = "300s"
lag = "30s"               # how late, on average, each sees the value
bias = 8.0                # cents toward yes: what they want to be true
threshold = 4.0           # cents: half the width of each one's range of fair values
order_size = 5
max_position = 300
latency = { to_exchange = "200us", from_exchange = "200us", jitter = "50us" }
account = { max_position = 305, max_order_quantity = 5 }

[[agents]]
type = "momentum"
name = "trend"
count = 5
interval = "1s"
fast_half_life = "5s"
slow_half_life = "60s"
threshold = 1.0
order_size = 3
max_position = 30
latency = { to_exchange = "500us", from_exchange = "500us", jitter = "200us" }
account = { max_position = 33, max_order_quantity = 3 }
