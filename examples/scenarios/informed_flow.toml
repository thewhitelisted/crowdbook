# The asset has a true value that drifts fast, as a random walk. Two experts see it within a
# fraction of a second and thirty followers about ten seconds late, each with a lasting view of its
# own, and each trades whenever the book is outside its range of fair values. The summary prints the
# final true value next to the last price, which shows how much the price learned. PnL values open
# positions at the last trade price, so it understates informed traders holding positions the price
# has not caught up with yet.
#
#   crowdbook run examples/scenarios/informed_flow.toml --log informed_flow.csv

seed = 11
duration = "60s"
reference_price = 10000

[fundamental]
volatility = 4.0   # ticks per square root of a second; starts at the reference price
step = "100ms"

[[agents]]
type = "market_maker"
name = "maker"
risk_aversion = 0.005
volatility = 3.0
intensity = 0.3
quote_size = 10
max_inventory = 200
requote_interval = "50ms"
latency = { to_exchange = "20us", from_exchange = "20us" }
account = { max_position = 220, max_order_quantity = 10 }

[[agents]]
type = "market_maker"
name = "slow maker"
risk_aversion = 0.005
volatility = 3.0
intensity = 0.15
quote_size = 20
max_inventory = 200
requote_interval = "1s"
latency = { to_exchange = "200us", from_exchange = "200us" }
account = { max_position = 220, max_order_quantity = 20 }

[[agents]]
type = "zero_intelligence"
name = "noise"
count = 20
limit_rate = 1.0
market_rate = 1.0
cancel_rate = 0.2         # each resting order lives 5 s on average unless it fills
max_offset = 8
latency = { to_exchange = "300us", from_exchange = "300us", jitter = "100us" }
account = { max_position = 1000, max_order_quantity = 10 }

[[agents]]
type = "informed"
name = "experts"          # fast and close to right
count = 2
interval = "50ms"
noise = 1.0
error = 2.0               # ticks of lasting error in what each believes
error_memory = "300s"
lag = "200ms"             # how late, on average, each sees the value
threshold = 2.0           # ticks: half the width of each one's range of fair values
order_size = 5
max_position = 200
latency = { to_exchange = "100us", from_exchange = "100us", jitter = "20us" }
account = { max_position = 205, max_order_quantity = 5 }

[[agents]]
type = "informed"
name = "followers"        # slower, with views of their own
count = 30
interval = "1s"
noise = 1.0
error = 8.0               # ticks of lasting error in what each believes
error_memory = "300s"
lag = "10s"               # how late, on average, each sees the value
threshold = 6.0           # ticks: half the width of each one's range of fair values
order_size = 5
max_position = 200
latency = { to_exchange = "100us", from_exchange = "100us", jitter = "20us" }
account = { max_position = 205, max_order_quantity = 5 }
