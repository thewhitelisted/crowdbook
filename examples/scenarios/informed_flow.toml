# The asset has a true value that drifts as a random walk. Five informed traders see it, with
# noise, and trade whenever the book is at least 2 ticks wrong. The summary prints the final true
# value next to the last price, which shows how much the price learned. PnL values open positions
# at the last trade price, so it understates informed traders holding positions the price has not
# caught up with yet.
#
#   crowdbook run examples/scenarios/informed_flow.toml --log informed_flow.csv

seed = 11
duration = "60s"
reference_price = 10000

[fundamental]
volatility = 4.0   # ticks per square root of a second; starts at the reference price
step = "100ms"

[[agents]]
type = "market_maker"
name = "maker"
risk_aversion = 0.005
volatility = 3.0
intensity = 0.3
quote_size = 10
max_inventory = 200
requote_interval = "50ms"
latency = { to_exchange = "20us", from_exchange = "20us" }
account = { max_position = 220, max_order_quantity = 10 }

[[agents]]
type = "zero_intelligence"
name = "noise"
count = 20
limit_rate = 1.0
market_rate = 1.0
cancel_rate = 0.2         # each resting order lives 5 s on average unless it fills
max_offset = 8
latency = { to_exchange = "300us", from_exchange = "300us", jitter = "100us" }
account = { max_position = 1000, max_order_quantity = 10 }

[[agents]]
type = "informed"
name = "informed"
count = 5
interval = "50ms"
noise = 1.0        # ticks of error in each look at the true value
threshold = 2.0    # ticks of edge needed before trading
order_size = 5
max_position = 200
latency = { to_exchange = "100us", from_exchange = "100us", jitter = "20us" }
account = { max_position = 220, max_order_quantity = 5 }
