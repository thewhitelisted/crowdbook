# A template for crowdbook-calibrate and crowdbook-generate: the contract on a game of
# examples/scenarios/game.toml, with ${name} wherever game_spec.toml fits or draws a setting: the
# home side's chance at kickoff, how much is scored, how the strength drifts, how wide and how
# late the makers quote, how late the sharp traders are, and how many bettors there are and how
# they lean.
#
#   uv run --project analysis crowdbook-generate examples/calibration/game_spec.toml \
#       --markets 1000 --out games --sample-interval 1

seed = 1
duration = "135m"

[prediction]
probability = ${probability}
step = "1s"

[prediction.game]
start = "30m"            # kickoff, after the market opens
length = "90m"           # playing time
periods = 2
break = "15m"
scores = ${scores}
late_scoring = ${late_scoring}
points = [1]
tie = 0                  # cents a share pays on a draw
pregame_drift = ${pregame_drift}
in_play_drift = 0.1
news = 2                 # pieces of news expected before kickoff
news_size = 0.15

[exchange]
depth_levels = 10

[participant]
latency = { to_exchange = "50ms", from_exchange = "50ms" }
account = { max_position = 500, max_order_quantity = 100 }

[[agents]]
type = "market_maker"
name = "makers"
count = 3
quote_value = true
noise = 0.5
error = 0.7
error_memory = "120s"
lag = ${maker_lag}
risk_aversion = 0.001
volatility = 1.0
intensity = ${maker_intensity}
quote_size = 50
max_inventory = 2000
requote_interval = "500ms"
post_only = true
latency = { to_exchange = "20ms", from_exchange = "20ms" }
account = { max_position = 2100, max_order_quantity = 50 }

[[agents]]
type = "informed"
name = "sharps"
count = 4
interval = "1s"
noise = 0.3
error = 0.5
lag = ${sharp_lag}
threshold = 2.0
order_size = 20
size_tail = 1.5
max_position = 1000
latency = { to_exchange = "30ms", from_exchange = "30ms", jitter = "10ms" }
account = { max_position = 1000, max_order_quantity = 1000 }

[[agents]]
type = "informed"
name = "bettors"
count = ${bettors}
interval = "60s"
noise = 3.0
error = 4.0
error_memory = "600s"
lag = "20s"
bias = ${bias}
tilt = ${tilt}
threshold = 0.5
order_size = 5
size_tail = 1.2
max_position = 400
latency = { to_exchange = "200ms", from_exchange = "200ms", jitter = "100ms" }
account = { max_position = 400, max_order_quantity = 400 }

[[agents]]
type = "zero_intelligence"
name = "noise"
count = 10
limit_rate = 0.01
market_rate = 0.005
cancel_rate = 0.01
max_offset = 4
min_size = 1
max_size = 200
size_tail = 1.3
account = { max_position = 100000, max_order_quantity = 200 }
