# A template for fitting contracts on a game's total or spread, over or under a line, to recorded
# markets twin by twin, as game_twins.toml does for a side's win: each twin opens, kicks off and
# closes when its recorded market did, opens at its price and replays its game's scores. The
# recording labels each market with its `side` and `line`; for a total, the opening price sets how
# much the twin's game is expected to score. line_twins_spec.toml fits the traders.
#
#   uv run --project analysis crowdbook-calibrate examples/calibration/line_twins_spec.toml \
#       --real RECORDED_TOTALS

seed = 1
duration = "${duration}s"

[prediction]
probability = ${opening_probability}   # where the recorded market opened
step = "1s"

[prediction.game]
side = ${side:"over"}         # "over"/"under" a total, "home_spread"/"away_spread": a label
line = ${line}            # the line, a label of the recording
start = "${kickoff}s"     # kickoff, after the market opens
length = ${length:"90m"}        # playing time, a label for other sports
periods = ${periods:2}
break = ${break:"15m"}
scores = ${scores:2.5}    # scoring events a game, a label: a total's opening price scales it,
                          # but a spread needs it, ~200 for basketball with points [1, 2, 3]
late_scoring = ${late_scoring}
points = ${points:[1]}   # what a score is worth, a label for games scored otherwise
tie = 0                  # cents a share pays exactly on a whole-number line
pregame_drift = ${pregame_drift}
in_play_drift = 0.1
news = 2                 # pieces of news expected before kickoff
news_size = 0.15
script = ${script}       # the scores the recorded game had

[exchange]
depth_levels = 10
maker_fee = ${maker_fee:0}           # ticks a lot, labels of the recording: the venue's fees, so that
taker_fee = ${taker_fee:0}           # the edge check judges strategies after them
fee_curve = ${fee_curve:"flat"}      # or "probability": each fee times 4p(1 - p) at price p
order_delay = "${in_play_delay:5}s"   # in play, orders wait before they reach the book (a label);
order_delay_from = "${kickoff}s"   # cancels do not
clear_at = ["${kickoff}s"]          # the book is cleared at kickoff
order_delay_until = "${duration}s"

[participant]
latency = { to_exchange = "50ms", from_exchange = "50ms" }
account = { max_position = 500, max_order_quantity = 100 }

[[agents]]
type = "market_maker"
name = "makers"
count = 3
quote_value = true
noise = 0.5
error = 0.7
error_memory = "120s"
lag = ${maker_lag}
risk_aversion = 0.001
volatility = 1.0
intensity = ${maker_intensity}
quote_size = 50
max_inventory = 2000
requote_interval = "500ms"
post_only = true
quiet_from = "${kickoff}s"   # in play the makers stay away, or with a label quote that often
quiet_interval = ${maker_in_play_interval:"0s"}
latency = { to_exchange = "20ms", from_exchange = "20ms" }
account = { max_position = 2100, max_order_quantity = 50 }


[[agents]]
type = "market_maker"
name = "in_play_makers"      # makers who quote only in play, thin and wide, as some sports' books
count = ${in_play_makers:0}  # are: a label of the recording, none where it has none
quote_value = true
noise = 1.0
error = 1.0
error_memory = "120s"
lag = ${in_play_lag:"2s"}
risk_aversion = 0.001
volatility = 1.0
intensity = ${in_play_intensity:0.1}   # half spread about 1/intensity ticks: wide
quote_size = ${in_play_size:50}
max_inventory = 100000
requote_interval = ${in_play_requote:"5s"}
post_only = true
quiet_from = "0s"            # away until kickoff
quiet_until = "${kickoff}s"
latency = { to_exchange = "20ms", from_exchange = "20ms" }
account = { max_position = 200000, max_order_quantity = 10000 }
[[agents]]
type = "informed"
name = "sharps"
count = 4
interval = "1s"
noise = 0.3
error = 0.5
lag = ${sharp_lag}
threshold = 2.0
order_size = 20
size_tail = 1.5
max_position = 1000
latency = { to_exchange = "30ms", from_exchange = "30ms", jitter = "10ms" }
account = { max_position = 1000, max_order_quantity = 1000 }

[[agents]]
type = "informed"
name = "bettors"
count = ${bettors}
interval = "60s"
noise = 3.0
error = 4.0
error_memory = "600s"
lag = "20s"
bias = ${bias}
tilt = ${tilt}
threshold = 0.5
order_size = 5
size_tail = 1.2
max_position = 400
latency = { to_exchange = "200ms", from_exchange = "200ms", jitter = "100ms" }
account = { max_position = 400, max_order_quantity = 400 }

[[agents]]
type = "zero_intelligence"
name = "noise"
count = 10
limit_rate = 0.01
market_rate = 0.005
cancel_rate = 0.01
max_offset = 4
min_size = 1
max_size = 200
size_tail = 1.3
account = { max_position = 100000, max_order_quantity = 200 }
