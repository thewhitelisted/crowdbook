# What crowdbook-calibrate fits in game_twins.toml, twin by twin: each recorded game gets `seeds`
# twins for every candidate and `held_out` for the verdict. The book's statistics barely see how
# much is scored, when, or how the strength drifts before kickoff (docs/validation.md), so set
# `scores`, `late_scoring` and `pregame_drift` from the recorded scores and reference price
# where they can be: give each a narrow range around what the recording says.
template = "game_twins.toml"
condition = true
seeds = 3   # each candidate on three twins of every recorded market: two leave its ranking noisy
generations = 60
held_out = 10
# A game whose draw pays nothing starts its home side at 90% at most with 2.5 scores expected:
# heavier favourites are started there.
# Games last over two hours: a sample of the book every second is enough for these statistics.
sample_interval = 1.0

[parameters.scores]
low = 2.5
high = 4.5
start = 2.7

[parameters.late_scoring]
low = 0.5
high = 3.0
start = 1.0

[parameters.pregame_drift]
low = 0.02
high = 0.5
start = 0.15

[parameters.maker_intensity]
low = 0.2
high = 3.0
start = 0.8

[parameters.maker_lag]
low = 0.1
high = 10.0
start = 1.0
kind = "duration"

[parameters.sharp_lag]
low = 0.2
high = 10.0
start = 1.5
kind = "duration"

[parameters.bettors]
low = 5
high = 200
start = 60
whole = true

[parameters.tilt]
low = -0.2
high = 0.6
start = 0.3
log = false

[parameters.bias]
low = -5.0
high = 5.0
start = 2.0
log = false
