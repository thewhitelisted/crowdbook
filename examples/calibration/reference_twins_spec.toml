# What crowdbook-calibrate fits in reference_twins.toml, twin by twin: each recorded game gets
# `seeds` twins for every candidate and `held_out` for the verdict. The twins' value is the
# recorded reference price, so only the traders are fitted: how wide and how deep the makers
# quote, at the touch and behind it, how late the sharps see the value, and how much the others
# trade, down to markets where hardly anything trades.
template = "reference_twins.toml"
condition = true
seeds = 3   # each candidate on three twins of every recorded market: two leave its ranking noisy
generations = 40
held_out = 10
# Games last over two hours: a sample of the book every second is enough for these statistics.
sample_interval = 1.0
# Recordings that start hours before kickoff fit faster, on the part where the book moves,
# trimmed to the last hour before it and the game:
# around = { label = "kickoff", before = 3600 }

[parameters.maker_intensity]
low = 0.05
high = 3.0
start = 0.7

[parameters.maker_size]
low = 5
high = 50000
start = 3000
whole = true

[parameters.level_growth]
low = 0.2
high = 3.0
start = 1.0

[parameters.maker_lag]
low = 0.1
high = 600.0
start = 5.0
kind = "duration"

[parameters.maker_requote]
low = 0.1
high = 3600.0
start = 10.0
kind = "duration"

[parameters.maker_threshold]
low = 0.0
high = 10.0
start = 0.0
log = false

[parameters.maker_noise]
low = 0.01
high = 3.0
start = 0.5

[parameters.maker_error]
low = 0.01
high = 3.0
start = 0.7

[parameters.sharp_lag]
low = 0.2
high = 30.0
start = 1.5
kind = "duration"

[parameters.bettor_interval]
low = 10.0
high = 10000000.0
start = 3600.0
kind = "duration"

[parameters.sharp_threshold]
low = 0.5
high = 50.0
start = 3.0

[parameters.tilt]
low = -0.2
high = 0.6
start = 0.2
log = false

[parameters.noise_rate]
low = 0.000001
high = 0.05
start = 0.0001

[parameters.noise_cancel_rate]
low = 0.001
high = 1.0
start = 0.01

[parameters.noise_limit_rate]
low = 0.00001
high = 0.05
start = 0.001
