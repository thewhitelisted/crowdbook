# A template for fitting the contract on a game of examples/scenarios/game.toml to recorded games,
# twin by twin: each recorded market's twins open and close when it did (${duration}, seconds),
# kick off when it did (${kickoff}, a label of the recording, seconds from the market's opening),
# open where it did (${opening_probability}) and replay its scores (${script});
# game_twins_spec.toml fits the rest.
#
#   uv run --project analysis crowdbook-calibrate examples/calibration/game_twins_spec.toml \
#       --real RECORDED_GAMES

seed = 1
duration = "${duration}s"

[prediction]
probability = ${opening_probability}   # where the recorded market opened
step = "1s"

[prediction.game]
side = ${side:"home"}         # the result the contract pays on: a label of the recording, or "home"
start = "${kickoff}s"     # kickoff, after the market opens
length = "90m"           # playing time
periods = 2
break = "15m"
scores = ${scores}
late_scoring = ${late_scoring}
points = [1]
tie = 0                  # cents a share pays on a draw
pregame_drift = ${pregame_drift}
in_play_drift = 0.1
news = 2                 # pieces of news expected before kickoff
news_size = 0.15
script = ${script}       # the scores the recorded game had

[exchange]
depth_levels = 10
order_delay = "5s"         # while the game is in play, orders wait before they reach the book;
order_delay_from = "${kickoff}s"   # cancels do not
clear_at = ["${kickoff}s"]          # the book is cleared at kickoff
order_delay_until = "${duration}s"

[participant]
latency = { to_exchange = "50ms", from_exchange = "50ms" }
account = { max_position = 500, max_order_quantity = 100 }

[[agents]]
type = "market_maker"
name = "makers"
count = 3
quote_value = true
noise = 0.5
error = 0.7
error_memory = "120s"
lag = ${maker_lag}
risk_aversion = 0.001
volatility = 1.0
intensity = ${maker_intensity}
quote_size = 50
max_inventory = 2000
requote_interval = "500ms"
post_only = true
quiet_from = "${kickoff}s"   # in play the makers stay away, or with a label quote that often
quiet_interval = ${maker_in_play_interval:"0s"}
latency = { to_exchange = "20ms", from_exchange = "20ms" }
account = { max_position = 2100, max_order_quantity = 50 }

[[agents]]
type = "informed"
name = "sharps"
count = 4
interval = "1s"
noise = 0.3
error = 0.5
lag = ${sharp_lag}
threshold = 2.0
order_size = 20
size_tail = 1.5
max_position = 1000
latency = { to_exchange = "30ms", from_exchange = "30ms", jitter = "10ms" }
account = { max_position = 1000, max_order_quantity = 1000 }

[[agents]]
type = "informed"
name = "bettors"
count = ${bettors}
interval = "60s"
noise = 3.0
error = 4.0
error_memory = "600s"
lag = "20s"
bias = ${bias}
tilt = ${tilt}
threshold = 0.5
order_size = 5
size_tail = 1.2
max_position = 400
latency = { to_exchange = "200ms", from_exchange = "200ms", jitter = "100ms" }
account = { max_position = 400, max_order_quantity = 400 }

[[agents]]
type = "zero_intelligence"
name = "noise"
count = 10
limit_rate = 0.01
market_rate = 0.005
cancel_rate = 0.01
max_offset = 4
min_size = 1
max_size = 200
size_tail = 1.3
account = { max_position = 100000, max_order_quantity = 200 }
