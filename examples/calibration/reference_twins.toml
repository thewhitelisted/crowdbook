# A template for fitting a contract on a game to recorded games, twin by twin, when the recording
# has a reference price: the true value of each twin is the recorded reference (${value_path},
# from the tape's value table, in cents) and it settles where the recorded market did
# (${outcome}), so that the twins' makers and sharps see the moves the real market's reference
# made. Nothing about the game's scoring is fitted or assumed. Each twin opens and closes when
# its market did (${duration}, seconds) and kicks off when it did (${kickoff}, a label of the
# recording, seconds from the market's opening); reference_twins_spec.toml fits the traders.
#
#   uv run --project analysis crowdbook-calibrate examples/calibration/reference_twins_spec.toml \
#       --real RECORDED_GAMES

seed = 1
duration = "${duration}s"

[prediction]
probability = ${opening_probability}   # where the recorded market opened
path = ${value_path}                   # the recorded reference, [seconds, cents] pairs
outcome = ${outcome}                # where it settled, or where its value ended

[exchange]
depth_levels = 10
maker_fee = ${maker_fee:0}           # ticks a lot, labels of the recording: the venue's fees, so that
taker_fee = ${taker_fee:0}           # the edge check judges strategies after them
fee_curve = ${fee_curve:"flat"}      # or "probability": each fee times 4p(1 - p) at price p
order_delay = "${in_play_delay:5}s"   # in play, orders wait before they reach the book (a label);
order_delay_from = "${kickoff}s"   # cancels do not
clear_at = ["${kickoff}s"]          # the book is cleared at kickoff
order_delay_until = "${duration}s"

[participant]
latency = { to_exchange = "50ms", from_exchange = "50ms" }
account = { max_position = 500, max_order_quantity = 100 }

[[agents]]
type = "market_maker"
name = "makers"
count = 3
quote_value = true
noise = 0.5
error = 0.7
error_memory = "120s"
lag = ${maker_lag}               # how late they see the reference price
risk_aversion = 0.0001
volatility = 1.0
intensity = ${maker_intensity}
quote_size = ${maker_size}      # lots each quote: the size at the touch
levels = 5                      # a ladder of quotes a side, a tick apart,
level_growth = ${level_growth}  # each this many times the one nearer: the depth behind the touch
max_inventory = 1000000
requote_interval = ${maker_requote}   # how often they move their quotes: a book that hardly
post_only = true                       # moves is requoted rarely
quiet_from = "${kickoff}s"   # in play the makers stay away, or with a label quote that often
quiet_interval = ${maker_in_play_interval:"0s"}
latency = { to_exchange = "20ms", from_exchange = "20ms" }
account = { max_position = 2000000, max_order_quantity = 100000 }

[[agents]]
type = "informed"
name = "sharps"
count = 4
interval = "1s"
noise = 0.3
error = 0.5
lag = ${sharp_lag}
threshold = ${sharp_threshold}   # ticks of edge before they take: high, and they hardly trade
order_size = 20
size_tail = 1.5
max_position = 1000
latency = { to_exchange = "30ms", from_exchange = "30ms", jitter = "10ms" }
account = { max_position = 1000, max_order_quantity = 1000 }

[[agents]]
type = "informed"
name = "bettors"
count = 50
interval = ${bettor_interval}   # how often each looks: with the count, how much they trade
noise = 3.0
error = 4.0
error_memory = "600s"
lag = "20s"
tilt = ${tilt}
threshold = 0.5
order_size = 5
size_tail = 1.2
max_position = 400
latency = { to_exchange = "200ms", from_exchange = "200ms", jitter = "100ms" }
account = { max_position = 400, max_order_quantity = 400 }

[[agents]]
type = "zero_intelligence"
name = "noise"
count = 10
limit_rate = ${noise_limit_rate}   # their limit orders land inside a wide spread: few in a quiet book
market_rate = ${noise_rate}
cancel_rate = 0.01
max_offset = 4
min_size = 1
max_size = 200
size_tail = 1.3
account = { max_position = 100000, max_order_quantity = 200 }
