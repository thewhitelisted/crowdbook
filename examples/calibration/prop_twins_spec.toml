# What crowdbook-calibrate fits in prop_twins.toml, twin by twin: each recorded game gets `seeds`
# twins for every candidate and `held_out` for the verdict, on a player's prop. A total's opening price
# sets how much its twins score, so only the pace through the game is left to fit beside the
# traders; set it narrowly from the recorded scores where they say.
template = "prop_twins.toml"
condition = true
seeds = 3   # each candidate on three twins of every recorded market: two leave its ranking noisy
generations = 60
held_out = 10
# Games last hours: a sample of the book every second is enough for these statistics.
sample_interval = 1.0

[parameters.late_scoring]
low = 0.5
high = 3.0
start = 1.0

# A start for thin, wide books: a half spread near 6 ticks, an intensity near 1/6.
[parameters.maker_intensity]
low = 0.05
high = 1.0
start = 0.17

[parameters.maker_lag]
low = 0.1
high = 10.0
start = 1.0
kind = "duration"

[parameters.sharp_lag]
low = 0.2
high = 10.0
start = 1.5
kind = "duration"

[parameters.bettors]
low = 5
high = 200
start = 60
whole = true

[parameters.tilt]
low = -0.2
high = 0.6
start = 0.3
log = false

[parameters.bias]
low = -5.0
high = 5.0
start = 2.0
log = false
