scenario = "# Challenge: work a large order. Buy 300 lots over ten minutes without paying more than the\n# market's average price.\n#\n#   crowdbook play examples/challenges/large_order.toml --record session.toml\n#   crowdbook serve examples/challenges/large_order.toml --seat broker\n\nseed = 22\nduration = \"600s\"\nreference_price = 10000\n\n[challenge]\nname = \"Work a large order\"\nbriefing = \"\"\"\nA client wants 300 lots bought before the close, ten minutes from now. You are measured against\nthe market's volume-weighted average price over the session: buying all 300 at that price scores\nzero, buying cheaper scores above zero. Every lot not bought by the end costs 10.\n\nBuy too fast and you push the price up against yourself; too slow and you may run out of time, or\nof market. The market maker and the noise traders supply liquidity; informed traders know where\nthe true value is going. Orders of at most 10 lots; your position may not go past 300 either way.\nFees: a rebate of 0.1 a lot for resting orders that trade, 0.2 a lot for taking.\"\"\"\n\n[scoring]\nmark = \"last\"\n\n[scoring.target]\nside = \"buy\"\nquantity = 300\nbenchmark = \"vwap\"\nunfinished_penalty = 10.0\n\n[fundamental]\nvolatility = 0.5\nstep = \"250ms\"\n\n[exchange]\ndepth_levels = 10\nmaker_fee = -0.1\ntaker_fee = 0.2\n\n[participant]\nlatency = { to_exchange = \"1ms\", from_exchange = \"1ms\" }\naccount = { max_position = 300, max_order_quantity = 10 }\n\n[[agents]]\ntype = \"zero_intelligence\"\nname = \"noise\"\ncount = 60\nlimit_rate = 0.5\nmarket_rate = 0.05\ncancel_rate = 0.1\nmax_offset = 8\nlatency = { to_exchange = \"300us\", from_exchange = \"300us\", jitter = \"100us\" }\naccount = { max_position = 200, max_order_quantity = 10 }\n\n[[agents]]\ntype = \"market_maker\"\nname = \"maker\"\nintensity = 1.0\nquote_size = 5\nmax_inventory = 100\nrequote_interval = \"250ms\"\npost_only = true\nlatency = { to_exchange = \"20us\", from_exchange = \"20us\" }\naccount = { max_position = 110, max_order_quantity = 10 }\n\n[[agents]]\ntype = \"informed\"\nname = \"informed\"\ncount = 5\ninterval = \"2s\"\nnoise = 1.0\nthreshold = 2.0\norder_size = 3\nmax_position = 300\nlatency = { to_exchange = \"200us\", from_exchange = \"200us\", jitter = \"50us\" }\naccount = { max_position = 303, max_order_quantity = 3 }\n"
