# The tutorial's market (docs/tutorial.md): an asset whose true value wanders, makers quoting
# around it as they see it, traders who follow it late and noise traders. The three ${name}s are
# what the tutorial fits; spec.toml gives their ranges. The [participant] and [learning] sections
# are the seat a strategy trades through (crowdbook_learn), and runs ignore them.

seed = 1
duration = "300s"
reference_price = 10000

[fundamental]
volatility = 2.0
step = "100ms"

[exchange]
depth_levels = 5
maker_fee = 1.0           # ticks a lot, paid by every trader
taker_fee = 1.0

# The strategy's seat: a millisecond from the exchange, and at most 50 lots either way.
[participant]
latency = { to_exchange = "1ms", from_exchange = "1ms" }
account = { max_position = 50, max_order_quantity = 10 }

[learning]
interval = "1s"
warmup = "5s"
depth_levels = 5

[[agents]]
type = "market_maker"
name = "makers"
count = 3
quote_value = true
noise = 0.5
lag = "100ms"
risk_aversion = 0.005
volatility = 2.0
intensity = ${maker_intensity}
quote_size = 20
max_inventory = 400
requote_interval = "100ms"
post_only = true
latency = { to_exchange = "50us", from_exchange = "50us" }
account = { max_position = 450, max_order_quantity = 20 }

[[agents]]
type = "zero_intelligence"
name = "noise"
count = 20
limit_rate = 0.5
market_rate = ${noise_market_rate}
cancel_rate = 0.2
max_offset = 6
min_size = 1
max_size = 50
size_tail = 1.5
latency = { to_exchange = "300us", from_exchange = "300us", jitter = "100us" }
account = { max_position = 100000, max_order_quantity = 50 }

[[agents]]
type = "informed"
name = "followers"
count = 20
interval = "1s"
noise = 1.0
error = 2.0
error_memory = "300s"
lag = ${follower_lag}
threshold = 3.0
order_size = 3
max_position = 100
latency = { to_exchange = "200us", from_exchange = "200us", jitter = "50us" }
account = { max_position = 105, max_order_quantity = 5 }
