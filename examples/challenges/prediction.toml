# Challenge: call the question. A prediction market on one yes-or-no question that resolves in ten
# minutes; traders who follow the news keep the price near the probability, and you don't see the
# news.
#
#   crowdbook play examples/challenges/prediction.toml --record session.toml
#   crowdbook serve examples/challenges/prediction.toml --seat trader

seed = 24
duration = "600s"

[challenge]
name = "Call the question"
briefing = """
This market is on one yes-or-no question, and it resolves in ten minutes. A share pays 100 if the
answer is yes and nothing if it is no, so prices run from 1 to 99 and the price is the market's
probability of yes, in cents. It starts at a coin flip.

News arrives about every minute and a half, and moves the probability. You don't see it. Six experts
do, within a second or two; thirty followers some twenty seconds later, each with a view of its own;
and eight partisans want the answer to be yes and think it eight cents likelier than it is. Noise
traders, two market makers and a few trend followers trade too. As the end nears, the same news
moves the probability further, and the price heads for 0 or 100.

You are scored at resolution: every share you hold is worth 100 or 0. You may hold 50 shares
either way and send 10 at a time; a loss of 2,000 stops you."""

[scoring]
mark = "value"
max_loss = 2000

[prediction]
probability = 0.5
news_rate = 0.011         # news about every ninety seconds
news_share = 0.6
step = "1s"

[exchange]
depth_levels = 10

[participant]
latency = { to_exchange = "1ms", from_exchange = "1ms" }
account = { max_position = 50, max_order_quantity = 10 }

[[agents]]
type = "zero_intelligence"
name = "noise"
count = 40
limit_rate = 0.5
market_rate = 0.05
cancel_rate = 0.1
max_offset = 3
latency = { to_exchange = "300us", from_exchange = "300us", jitter = "100us" }
account = { max_position = 200, max_order_quantity = 10 }

[[agents]]
type = "market_maker"
name = "maker"
volatility = 1.5
intensity = 1.0
quote_size = 5
max_inventory = 100
requote_interval = "250ms"
post_only = true
latency = { to_exchange = "20us", from_exchange = "20us" }
account = { max_position = 110, max_order_quantity = 10 }

[[agents]]
type = "market_maker"
name = "slow maker"
volatility = 4.5          # quotes three times as wide, which stand a second
intensity = 0.5
quote_size = 10
max_inventory = 100
requote_interval = "1s"
post_only = true
latency = { to_exchange = "200us", from_exchange = "200us" }
account = { max_position = 110, max_order_quantity = 10 }

[[agents]]
type = "informed"
name = "experts"          # fast and close to right
count = 6
interval = "500ms"
noise = 3.0
error = 2.0               # cents of lasting error in what each believes
error_memory = "300s"
lag = "1s"                # how late, on average, each sees the value
threshold = 2.0           # cents: half the width of each one's range of fair values
order_size = 5
max_position = 600
latency = { to_exchange = "200us", from_exchange = "200us", jitter = "50us" }
account = { max_position = 605, max_order_quantity = 5 }

[[agents]]
type = "informed"
name = "followers"        # slower, with views of their own
count = 30
interval = "5s"
noise = 3.0
error = 6.0               # cents of lasting error in what each believes
error_memory = "300s"
lag = "20s"               # how late, on average, each sees the value
threshold = 4.0           # cents: half the width of each one's range of fair values
order_size = 5
max_position = 300
latency = { to_exchange = "200us", from_exchange = "200us", jitter = "50us" }
account = { max_position = 305, max_order_quantity = 5 }

[[agents]]
type = "informed"
name = "partisans"        # tilted toward one side
count = 8
interval = "5s"
noise = 3.0
error = 6.0               # cents of lasting error in what each believes
error_memory = "300s"
lag = "10s"               # how late, on average, each sees the value
bias = 8.0                # cents toward yes: what they want to be true
threshold = 4.0           # cents: half the width of each one's range of fair values
order_size = 5
max_position = 300
latency = { to_exchange = "200us", from_exchange = "200us", jitter = "50us" }
account = { max_position = 305, max_order_quantity = 5 }

[[agents]]
type = "momentum"
name = "trend"
count = 3
interval = "1s"
fast_half_life = "5s"
slow_half_life = "60s"
threshold = 1.0
order_size = 3
max_position = 30
latency = { to_exchange = "500us", from_exchange = "500us", jitter = "200us" }
account = { max_position = 33, max_order_quantity = 3 }
