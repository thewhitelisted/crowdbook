# Challenge: trade the news. The true value jumps without warning, about once a minute; the
# traders who know it move the price after it, and you can follow them, or not.
#
#   crowdbook play examples/challenges/news.toml --record session.toml
#   crowdbook serve examples/challenges/news.toml --seat trader

seed = 23
duration = "600s"
reference_price = 10000

[challenge]
name = "Trade the news"
briefing = """
News hits this market about once a minute: the true value jumps by around eight ticks, up or
down. You don't see the news. Two experts do, a couple of seconds late; a crowd of thirty
followers hears of it half a minute later, give or take, each with a view of its own. Between them
they push the price to the new value over a minute or so, and a trend follower or two join in.

Find the jumps in the tape and trade them before the price has caught up, then get out. Positions
are valued at the true value at the end, and each lot still held then costs 1. You may hold 30
lots either way and send 10 at a time; a loss of 1,500 stops you. Fees: a rebate of 0.1 a lot for
resting orders that trade, 0.2 a lot for taking."""

[scoring]
mark = "value"
close_penalty = 1.0
max_loss = 1500

[fundamental]
volatility = 0.3
step = "250ms"
jump_rate = 0.0167        # news about once a minute
jump_size = 8.0           # ticks

[exchange]
depth_levels = 10
maker_fee = -0.1
taker_fee = 0.2

[participant]
latency = { to_exchange = "1ms", from_exchange = "1ms" }
account = { max_position = 30, max_order_quantity = 10 }

[[agents]]
type = "zero_intelligence"
name = "noise"
count = 60
limit_rate = 0.5
market_rate = 0.05
cancel_rate = 0.1
max_offset = 8
latency = { to_exchange = "300us", from_exchange = "300us", jitter = "100us" }
account = { max_position = 200, max_order_quantity = 10 }

[[agents]]
type = "market_maker"
name = "maker"
intensity = 1.0
quote_size = 5
max_inventory = 100
requote_interval = "250ms"
post_only = true
latency = { to_exchange = "20us", from_exchange = "20us" }
account = { max_position = 110, max_order_quantity = 10 }

[[agents]]
type = "market_maker"
name = "slow maker"
intensity = 0.5
quote_size = 10
max_inventory = 100
requote_interval = "1s"
post_only = true
latency = { to_exchange = "200us", from_exchange = "200us" }
account = { max_position = 110, max_order_quantity = 10 }

[[agents]]
type = "informed"
name = "experts"          # fast and close to right
count = 2
interval = "2s"
noise = 1.0
error = 1.0               # ticks of lasting error in what each believes
error_memory = "300s"
lag = "2s"                # how late, on average, each sees the value
threshold = 2.0           # ticks: half the width of each one's range of fair values
order_size = 3
max_position = 300
latency = { to_exchange = "200us", from_exchange = "200us", jitter = "50us" }
account = { max_position = 303, max_order_quantity = 3 }

[[agents]]
type = "informed"
name = "followers"        # slower, with views of their own
count = 30
interval = "5s"
noise = 1.0
error = 3.0               # ticks of lasting error in what each believes
error_memory = "300s"
lag = "30s"               # how late, on average, each sees the value
threshold = 4.0           # ticks: half the width of each one's range of fair values
order_size = 3
max_position = 200
latency = { to_exchange = "200us", from_exchange = "200us", jitter = "50us" }
account = { max_position = 203, max_order_quantity = 3 }

[[agents]]
type = "momentum"
name = "trend"
count = 2
interval = "500ms"
fast_half_life = "2s"
slow_half_life = "20s"
threshold = 1.0
order_size = 3
max_position = 30
latency = { to_exchange = "500us", from_exchange = "500us", jitter = "200us" }
account = { max_position = 33, max_order_quantity = 3 }
