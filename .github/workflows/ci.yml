name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 runs on arm64 and ubuntu-24.04 on x86-64: the golden test checks that runs
          # come out byte for byte the same on both.
          - name: macos / apple-clang / dev
            os: macos-15
            preset: dev
          - name: linux / gcc-14 / dev
            os: ubuntu-24.04
            preset: dev
            cc: gcc-14
            cxx: g++-14
          - name: linux / gcc-14 / release
            os: ubuntu-24.04
            preset: release
            cc: gcc-14
            cxx: g++-14
          - name: linux / gcc-14 / asan
            os: ubuntu-24.04
            preset: asan
            cc: gcc-14
            cxx: g++-14
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install ninja

      # The learning module's Python, with the NumPy and Gymnasium its tests use. The sanitizer
      # build leaves the module out.
      - name: Set up Python
        if: matrix.preset != 'asan'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the learning module's test requirements
        if: matrix.preset != 'asan'
        run: |
          python -m pip install --disable-pip-version-check -r python/requirements.txt
          echo "Python_ROOT_DIR=$pythonLocation" >> "$GITHUB_ENV"

      - name: Select compiler
        if: matrix.cxx
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Configure, build and test
        shell: bash
        run: |
          set +e
          cmake --workflow --preset ${{ matrix.preset }} 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the first errors as annotations, which show without opening the log.
            # Tests that time out or crash, and sanitizer reports, are named too.
            grep -E ': error|^FAILED:|\(Failed\)|\*\*\*Failed|\*\*\*Timeout|\*\*\*Exception|\((Timeout|Subprocess|SEGFAULT|ILLEGAL|BUS|OTHER_FAULT)|tests failed|CMake Error|^(FAIL|ERROR): |Error: |allocations per request|runtime error|ERROR: AddressSanitizer|SUMMARY: ' build.log |
              head -n 20 |
              while IFS= read -r line; do echo "::error::${line//%/%25}"; done
          fi
          exit "$status"

      # The module is built only when CMake finds Python, and its tests run only with NumPy, so
      # check that they ran here, with Gymnasium.
      - name: Check the learning module was tested
        if: matrix.preset != 'asan'
        shell: bash
        run: |
          python=$(sed -n 's/^_\{0,1\}Python_EXECUTABLE:[A-Z]*=//p' \
            build/${{ matrix.preset }}/CMakeCache.txt | head -n 1)
          echo "CMake found ${python:-no Python}"
          "$python" -c "import gymnasium, numpy"
          grep -E 'python\.learning \.+ +Passed' build.log

      # Numbers for an x86-64 Linux server, shown as notices on the run (at most ten a step): the
      # benchmarks and the server under load. Shared runners are noisy, so these inform rather
      # than gate.
      - name: Measure (Linux release)
        if: matrix.preset == 'release' && runner.os == 'Linux'
        shell: bash
        run: |
          notice() { echo "::notice::${1//%/%25}"; }
          notice "$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2), $(nproc) cores"
          build/release/bench/crowdbook_bench \
            --benchmark_filter='MixedOrderFlow|ChallengeMarket/0|ServedChallenge/0|LargeMarket|GatewayRoundTrip|EncodeDepth|MemoryPerMarket|LearningPool/markets:(1|64)/threads:(1|4)/|LearningReset' \
            2>/dev/null | grep '^BM_' | awk '{print $1, $2, $3, $NF}' | paste -sd ';' - |
            while IFS= read -r line; do notice "$line"; done
          for args in "--clients 1" "--clients 50" "--clients 200" "--clients 200 --feed-interval 10000"; do
            result=$(build/release/bench/crowdbook_load $args --rate 20 --seconds 10 |
              grep -E "beyond|server thread" | sed 's/  */ /g' | paste -sd ';' -)
            notice "load $args: $result"
          done

  container:
    name: container / docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build --tag crowdbook .

      - name: Run a market in it
        run: |
          docker run --rm crowdbook --version
          docker run --rm crowdbook run \
            /usr/local/share/crowdbook/examples/scenarios/market_maker.toml --duration 2s
          docker run --rm crowdbook replay \
            /usr/local/share/crowdbook/examples/sessions/served_demo.toml

  analysis:
    name: analysis / python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: pipx install uv

      - name: Test
        run: uv run --project analysis --locked python -m unittest discover -s analysis/tests
