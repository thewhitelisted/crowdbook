name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 runs on arm64 and ubuntu-24.04 on x86-64: the golden test checks that runs
          # come out byte for byte the same on both.
          - name: macos / apple-clang / dev
            os: macos-15
            preset: dev
          - name: linux / gcc-14 / dev
            os: ubuntu-24.04
            preset: dev
            cc: gcc-14
            cxx: g++-14
          - name: linux / gcc-14 / release
            os: ubuntu-24.04
            preset: release
            cc: gcc-14
            cxx: g++-14
          - name: linux / gcc-14 / asan
            os: ubuntu-24.04
            preset: asan
            cc: gcc-14
            cxx: g++-14
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install ninja

      - name: Select compiler
        if: matrix.cxx
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Configure, build and test
        shell: bash
        run: |
          set +e
          cmake --workflow --preset ${{ matrix.preset }} 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the first errors as annotations, which show without opening the log.
            grep -E ': error|^FAILED:|\(Failed\)|\*\*\*Failed|tests failed|CMake Error|^(FAIL|ERROR): |Error: |allocations per request' build.log |
              head -n 20 |
              while IFS= read -r line; do echo "::error::${line//%/%25}"; done
          fi
          exit "$status"

  container:
    name: container / docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build --tag crowdbook .

      - name: Run a market in it
        run: |
          docker run --rm crowdbook --version
          docker run --rm crowdbook run \
            /usr/local/share/crowdbook/examples/scenarios/market_maker.toml --duration 2s
          docker run --rm crowdbook replay \
            /usr/local/share/crowdbook/examples/sessions/served_demo.toml

  analysis:
    name: analysis / python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: pipx install uv

      - name: Test
        run: uv run --project analysis --locked python -m unittest discover -s analysis/tests
