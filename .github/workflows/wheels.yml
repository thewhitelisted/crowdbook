name: wheels

# The wheels an outsider installs: crowdbook-engine (the crowdbook command and the learning pool)
# for Linux and macOS, crowdbook-analysis and the Python client, and the tutorial run from them
# alone, as docs/tutorial.md has a newcomer run it. A tag v* also attaches them to a GitHub release
# and then publishes that release's files on PyPI.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          A published release's tag, vX.Y.Z, whose files to put on PyPI: for a release made
          before this workflow published them. Empty to build only.
        required: false
        default: ''

permissions:
  contents: read

# A run that publishes a release by hand has a group of its own, so that no push cancels it
# halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.publish }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine wheel / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
          - name: linux arm64
            os: ubuntu-24.04-arm
          - name: macos arm64
            os: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Builds in manylinux_2_28 on Linux, and tests each wheel there: the command, and the
      # learning module's tests.
      - name: Build and test
        run: |
          python -m pip install --disable-pip-version-check cibuildwheel==4.3.1
          python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: engine-${{ matrix.os }}
          path: wheelhouse/*.whl

  python:
    name: analysis, client and source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: pipx install uv

      - name: Build
        run: |
          uv build --out-dir dist analysis
          uv build --out-dir dist clients/python
          uv build --sdist --out-dir dist .

      - uses: actions/upload-artifact@v7
        with:
          name: python
          path: dist/*

  # The tutorial from the wheels alone, in a fresh environment of a later Python than the wheels
  # were built for: no compiler, no build directory. Its fit and checks are cut short; the
  # tutorial's own numbers come from the full lengths.
  tutorial:
    name: tutorial / ${{ matrix.os }}
    needs: [engine, python]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: actions/download-artifact@v8
        with:
          name: engine-${{ matrix.os }}
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: python
          path: dist

      - name: Install
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check dist/crowdbook_engine-*.whl \
            dist/crowdbook_analysis-*.whl

      - name: Run the tutorial
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          tutorial="$GITHUB_WORKSPACE/examples/tutorial"
          crowdbook --version
          crowdbook-generate "$tutorial/spec.toml" --markets 20 --seed 2026 \
            --fixed maker_intensity=0.8,noise_market_rate=0.3,follower_lag=10 --out recording
          status=0
          crowdbook-assess "$tutorial/spec.toml" --real recording/shard-00000 --output assessed \
            --generations 2 --seeds 4 --held-out 10 --sweep-seeds 10 --confirm 20 || status=$?
          # 0 is usable and 1 not; anything else is a failure to run.
          test "$status" -le 1
          test -s assessed/verdict.md
          crowdbook-draws "$tutorial/spec.toml" --report assessed/report.json --count 4 --out draws
          python "$tutorial/strategy.py" assessed/scenario.toml draws \
            --truth maker_intensity=0.8,noise_market_rate=0.3,follower_lag=10 --seeds 8 | tee strategy.md
          test "$(grep -c '^| ' strategy.md)" -eq 4  # the header and three markets

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine, python, tutorial]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check the tag is the project's version
        run: |
          version=$(sed -nE 's/^ +VERSION ([0-9.]+)$/\1/p' CMakeLists.txt | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME is not the project's version $version"; exit 1; }

      # The notes are docs/releases/<tag>.md, written before the tag is pushed. A release made by
      # hand for the tag before this runs, draft or not, is filled in and published rather than left
      # without its files.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "crowdbook $GITHUB_REF_NAME" --notes-file "$notes" \
              --draft=false
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "crowdbook $GITHUB_REF_NAME" --notes-file "$notes"
          fi

  # Each project goes to PyPI from the GitHub release's own files, the ones the tutorial ran on,
  # through PyPI's trusted publishing: no token is stored, and each project trusts only this
  # workflow in its own environment.
  pypi:
    name: pypi / ${{ matrix.project }}
    needs: [release]
    if: >-
      !cancelled() && (
        (startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish != ''))
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: crowdbook-engine
            files: crowdbook_engine-*
            count: 4 # three wheels and the source
            environment: pypi
          - project: crowdbook-analysis
            files: crowdbook_analysis-*
            count: 2
            environment: pypi-analysis
          - project: crowdbook
            files: crowdbook-[0-9]*
            count: 2
            environment: pypi-client
    environment:
      name: ${{ matrix.environment }}
      url: https://pypi.org/project/${{ matrix.project }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the release's files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.publish || github.ref_name }}
          FILES: ${{ matrix.files }}
          COUNT: ${{ matrix.count }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::'$TAG' is not a release tag vX.Y.Z"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern "$FILES"
          version="${TAG#v}"
          for file in dist/*; do
            case "${file##*/}" in
              *-"$version"-*.whl | *-"$version".tar.gz) echo "$file" ;;
              *) echo "::error::$file is not version $version"; exit 1 ;;
            esac
          done
          files=(dist/*)
          [[ ${#files[@]} -eq $COUNT ]] || {
            echo "::error::the release has ${#files[@]} of the $COUNT files expected"; exit 1; }

      # Files PyPI already has are left alone, so that a run stopped partway can be run again.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
